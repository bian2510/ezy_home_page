<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2c8380" />

    <!--
      Verificación de propiedad de Google Search Console, para la propiedad
      `https://shop.ezyhome.app/`. El token es por propiedad: si se crea otra,
      Google entrega uno nuevo y hay que reemplazar este.

      Va acá y no como archivo suelto en `public/`: el sitio es una SPA y
      Cloudflare responde 200 con este HTML para cualquier ruta inexistente,
      así que el método de archivo falla siempre — Google pide un archivo
      inventado, recibe 200, y concluye que el servidor le da 200 a todo.

      No borrar: sacarla revierte la verificación y se pierde el acceso a los
      informes.
    -->
    <meta name="google-site-verification" content="-Y66DOp6rxRGNfDC-C3zwVsjWSi1NJ1RjIcWDaScmyo" />

    <!--
      Metadatos por defecto. Cada ruta los reescribe en runtime con
      `useDocumentMeta` (src/hooks/useDocumentMeta.ts), que es lo que lee
      Googlebot: ejecuta JavaScript.

      Los crawlers de WhatsApp, Instagram y Facebook NO ejecutan JS: para ellos
      esto es todo lo que hay, así que el preview de cualquier link compartido
      es el de la marca, no el del producto. Arreglarlo requiere prerender
      (docs/plans/2026-09-22-seo-organico.md, bloque 3).
    -->
    <meta
      name="description"
      content="EzyHome — Iluminación inteligente, automatización y seguridad para el hogar argentino. Simple, confiable y al alcance de todos."
    />
    <title>EzyHome — Domótica para tu casa</title>

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="EzyHome" />
    <meta property="og:title" content="EzyHome — Domótica para tu casa" />
    <meta
      property="og:description"
      content="Iluminación inteligente, automatización y seguridad para el hogar argentino. Simple, confiable y al alcance de todos."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/images/smart-bulb.jpg" />
    <meta property="og:locale" content="es_AR" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      Precarga de la foto del hero del Home (el LCP), solo en `/`: es una SPA
      con un solo HTML, y un preload fijo la bajaría también en el catálogo o
      en un producto. Mismas variantes que `src/features/home/homeHeroImage.ts`
      (un test verifica que coincidan).
    -->
    <script>
      if (location.pathname === '/') {
        var heroPreload = document.createElement('link');
        heroPreload.rel = 'preload';
        heroPreload.as = 'image';
        heroPreload.setAttribute('fetchpriority', 'high');
        heroPreload.setAttribute('imagesizes', '100vw');
        heroPreload.setAttribute(
          'imagesrcset',
          '/images/hero/inicio-640.webp 640w, /images/hero/inicio-1024.webp 1024w, /images/hero/inicio-1376.webp 1376w',
        );
        document.head.appendChild(heroPreload);
      }
    </script>
  </head>
  <body class="bg-background text-foreground antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
